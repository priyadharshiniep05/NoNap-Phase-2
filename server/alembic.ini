# Alembic config for DB2 (ops_db). The server runs these migrations on startup
# (server/app/db/migrate.py), so you rarely need the CLI. Manual use, from the repo root:
#   PYTHONPATH=. server/.venv/bin/alembic -c server/alembic.ini upgrade head
[alembic]
script_location = server/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

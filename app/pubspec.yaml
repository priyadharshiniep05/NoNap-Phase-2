name: app
description: "NoNap - Real-Time Driver Drowsiness Detection System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3+1
  web_socket_channel: ^3.0.0
  flutter_secure_storage: ^9.2.2
  flutter_local_notifications: ^17.2.1
  fl_chart: ^0.68.0
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  audioplayers: ^6.0.0
  flutter_animate: ^4.5.2
  phosphor_flutter: ^2.1.0
  flutter_tts: ^4.2.5
  torch_light: ^1.1.0
  wakelock_plus: ^1.5.2
  audio_session: ^0.2.4
  vibration: ^3.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  ios: true
  image_path: "assets/brand/nonap_icon_1024.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0F172A"
  image: "assets/brand/nonap_icon_1024.png"
  ios: true
  android: false
  fullscreen: false

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/sounds/
    - assets/google_fonts/

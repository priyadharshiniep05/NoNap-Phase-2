; NoNap Raspberry Pi client configuration.
; Any value can also be overridden with an environment variable NONAP_<KEY>,
; for example NONAP_SERVER_URL=http://192.168.2.1:8000

[server]
; The MacBook running the backend (find it with: ipconfig getifaddr en0).
; With the Pi plugged into the Mac via Internet Sharing this is usually http://192.168.2.1:8000
server_url = http://192.168.2.1:8000
; Must match DEVICE_API_KEY in the backend's .env
device_key = nonap-dev-device-key

[device]
device_id = nonap-pi-01
; The driver this camera watches: their login email or user id
driver_id = driver1@nonap.demo
; Shown on the fleet dashboard
vehicle = KA 01 AB 4521

[camera]
; auto = picamera, then raspistill, then rpicam-still / libcamera-still
backend = auto
fps = 3
; Lowest rate the client drops to when the server is slow
min_fps = 0.5
width = 320
height = 240
jpeg_quality = 70
; 0, 90, 180 or 270 depending on how the camera is mounted
rotation = 0
hflip = false

[alerts]
led_enabled = true
sound_enabled = true
; Leave empty for the system default. If sound comes out of HDMI instead of the jack,
; list devices with `aplay -L` and set e.g. plughw:CARD=Headphones,DEV=0 (Bullseye) or plughw:0,0
aplay_device =
chime_wav = sounds/chime.wav
alarm_wav = sounds/alarm.wav
; There is no buzzer in this build. Leave false.
buzzer_enabled = false
